name: Build and Deploy Eleventy Site

on:
  push:
    branches:
      - main  # or the branch you are working from

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Cache RAG embedding model and vectors
        uses: actions/cache@v4
        with:
          path: .cache/rag
          key: rag-${{ runner.os }}-${{ hashFiles('src/js/rag/config.mjs', 'package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            rag-${{ runner.os }}-${{ hashFiles('src/js/rag/config.mjs', 'package-lock.json') }}-

      - name: Build RAG index and browser assets
        run: npm run rag:build

      - name: Check RAG retrieval
        run: npm run test:rag

      - name: Build CSS
        run: npm run sass:process   # Ensure Sass compiles CSS

      - name: Build site with Eleventy
        run: npx eleventy

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages  # Deploy to the main branch
          folder: dist  # Deploy files from the root of the repository
