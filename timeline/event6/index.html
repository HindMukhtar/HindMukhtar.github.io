<!DOCTYPE html>
<html><head></head><body><section class="inner-wrapper career" aria-labelledby="career-heading"><div class="career__heading"><h2 id="career-heading">Career Journey</h2><div class="career__controls"><button type="button" data-timeline-direction="-1" aria-label="Scroll career journey left" aria-controls="career-timeline">←</button> <button type="button" data-timeline-direction="1" aria-label="Scroll career journey right" aria-controls="career-timeline">→</button></div></div><div class="timeline" id="career-timeline" tabindex="0" role="region" aria-label="Career journey entries"></div></section><script>(() => {
    const timeline = document.getElementById('career-timeline');
    const buttons = document.querySelectorAll('[data-timeline-direction]');
    const updateControls = () => {
      buttons[0].disabled = timeline.scrollLeft <= 1;
      buttons[1].disabled = timeline.scrollLeft + timeline.clientWidth >= timeline.scrollWidth - 1;
    };
    buttons.forEach(button => button.addEventListener('click', () => {
      timeline.scrollBy({
        left: Number(button.dataset.timelineDirection) * timeline.clientWidth * 0.8,
        behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'
      });
    }));
    timeline.addEventListener('scroll', updateControls, { passive: true });
    window.addEventListener('resize', updateControls);
    updateControls();
  })();</script></body></html>
